<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="valBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1923"/>
      <stop offset="100%" stop-color="#17212B"/>
    </linearGradient>
    <linearGradient id="valRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5866"/>
      <stop offset="100%" stop-color="#FF4655"/>
    </linearGradient>
    <linearGradient id="valWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE8E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF4655" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Tactical Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#valBg)"/>
  
  <!-- Subtle Crimson Border Outline -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FF4655" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Corner Tactical Accents -->
  <path d="M 44 84 L 44 44 L 84 44" fill="none" stroke="#FF4655" stroke-width="5" stroke-linecap="round"/>
  <path d="M 468 428 L 468 468 L 428 468" fill="none" stroke="#FF4655" stroke-width="5" stroke-linecap="round"/>

  <!-- Valorant Emblem -->
  <g filter="url(#glow)">
    <!-- Left Blade (Radiant Red) -->
    <path d="M 130 136 H 230 L 285 376 H 185 Z" fill="url(#valRed)"/>
    
    <!-- Right Blade (Off-white) -->
    <path d="M 290 136 H 390 L 335 256 H 235 Z" fill="url(#valWhite)"/>
  </g>
</svg>
